# XcodeGen spec for GeoFake Sample. Regenerate the Xcode project with:
#   xcodegen generate --spec SampleApp/project.yml --project SampleApp
name: GeoFakeSample
options:
  bundleIdPrefix: com.newtonjapan
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "3.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  # This repository itself. In your own project, add https://github.com/AlohaYos/GeoFake instead.
  GeoFake:
    path: ..
targets:
  GeoFakeSample:
    type: application
    platform: iOS
    sources:
      - GeoFakeSample
    dependencies:
      - package: GeoFake
        product: GeoFake
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.newtonjapan.geofakesample
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: GeoFake Sample
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Shows where you are and tells you when you enter or leave the fences."
        INFOPLIST_KEY_NSMotionUsageDescription: "Shows whether you are walking, running, cycling or driving."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
