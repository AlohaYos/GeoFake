# Arrival Alerts: a GeoFake sample. Pins on a map notify you when you arrive or leave, worded by how you move.
# Regenerate the Xcode project with:
#   xcodegen generate --spec ArrivalApp/project.yml --project ArrivalApp
name: GeoFakeArrival
options:
  bundleIdPrefix: com.newtonjapan
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "3.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  GeoFake:
    path: ..
targets:
  GeoFakeArrival:
    type: application
    platform: iOS
    sources:
      - GeoFakeArrival
    dependencies:
      - package: GeoFake
        product: GeoFake
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.newtonjapan.geofakearrival
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Arrival Alerts
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Shows where you are and notifies you when you arrive at or leave your spots."
        INFOPLIST_KEY_NSMotionUsageDescription: "Words each notification by how you are moving: walking, running, cycling or driving."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - GeoFakeArrivalTests
  GeoFakeArrivalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GeoFakeArrivalTests
    dependencies:
      - target: GeoFakeArrival
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.newtonjapan.geofakearrival.tests
        GENERATE_INFOPLIST_FILE: YES
